<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html,body { width:120px; height:140px; background:transparent; overflow:hidden; }
  .heart {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:72px; height:72px;
    cursor:pointer;
    -webkit-app-region:no-drag;
  }
  .heart::before, .heart::after {
    content:''; position:absolute; width:36px; height:60px;
    background:#ff5e93; border-radius:36px 36px 0 0;
    box-shadow:0 0 18px rgba(255,94,147,.7);
    filter:drop-shadow(0 0 6px rgba(255,120,170,.6));
  }
  .heart::before { left:36px; transform:rotate(-45deg); transform-origin:0 100%; }
  .heart::after  { left:0;   transform:rotate(45deg);  transform-origin:100% 100%; }
  .wrap {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:72px; height:72px;
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform:translate(-50%,-50%) scale(.92); opacity:.7; }
    50%      { transform:translate(-50%,-50%) scale(1.12); opacity:1; }
  }
  .glow {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:96px; height:96px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,120,170,.35), transparent 70%);
    animation:glow 2.4s ease-in-out infinite;
  }
  @keyframes glow {
    0%,100% { opacity:.3; transform:translate(-50%,-50%) scale(.8); }
    50%      { opacity:.7; transform:translate(-50%,-50%) scale(1.3); }
  }
  .hint {
    position:absolute; bottom:-2px; left:0; right:0; text-align:center;
    font-size:10px; color:#ff8fb5; text-shadow:0 0 4px rgba(0,0,0,.4);
    opacity:0; transition:opacity .3s;
  }
  body:hover .hint { opacity:1; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap"><div class="heart"></div></div>
  <div class="hint">点我唤回</div>
<script>
  document.body.addEventListener('click', () => window.desktop.summon());
  // enter/exit to keep mouse events live only on hover region
  document.body.addEventListener('mouseenter', () => window.desktop.setHeartHover(true));
  document.body.addEventListener('mouseleave', () => window.desktop.setHeartHover(false));
</script>
</body>
</html>
