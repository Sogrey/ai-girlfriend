<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Desktop AI Girlfriend</title>
  <script type="importmap">
  {
    "imports": {
      "three": "app://local/node_modules/three/build/three.module.js",
      "three/": "app://local/node_modules/three/",
      "three/examples/jsm/": "app://local/node_modules/three/examples/jsm/",
      "@pixiv/three-vrm": "app://local/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
    }
  }
  </script>
  <link rel="stylesheet" href="/renderer/styles/main.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- Voice recording indicator -->
  <div id="rec-indicator" class="rec-indicator hidden"><span class="dot"></span> 正在聆听</div>

  <!-- Floating toolbar -->
  <div id="toolbar" class="toolbar hidden">
    <button data-act="mic"      title="语音对话">🎤</button>
    <button data-act="chat"     title="文字聊天">💬</button>
    <button data-act="costume"  title="换装">👗</button>
    <button data-act="leave"    title="让她休息">👋</button>
    <button data-act="settings" title="设置">⚙️</button>
  </div>

  <!-- Chat panel -->
  <div id="chat-panel" class="panel hidden">
    <div id="chat-log" class="chat-log"></div>
    <div class="chat-input-row">
      <button id="chat-memory" title="她记得什么">🧠</button>
      <input id="chat-input" type="text" placeholder="说点什么…" autocomplete="off" />
      <button id="chat-send">发送</button>
    </div>
  </div>

  <!-- Costume quick bar -->
  <div id="costume-bar" class="costume-bar hidden">
    <span class="cb-title">换装</span>
    <button data-costume="casual">日常</button>
    <button data-costume="school">水手服</button>
    <button data-costume="stylish">时尚</button>
    <button data-costume="gothic">洋装</button>
    <button data-costume="seed">科技</button>
    <button class="cb-close">×</button>
  </div>

  <!-- Settings panel -->
  <div id="settings-panel" class="panel hidden">
    <div class="panel-header">设置 <button class="panel-close" data-close="settings">×</button></div>
    <div class="settings-body">

      <fieldset>
        <legend>AI 大模型</legend>
        <label>Provider
          <select id="set-llm-provider">
            <option value="deepseek">DeepSeek（在线）</option>
            <option value="ollama">Ollama（本地）</option>
          </select>
        </label>
        <label data-for="deepseek">DeepSeek API Key
          <input id="set-deepseek-key" type="password" placeholder="sk-..." />
        </label>
        <label data-for="deepseek">模型
          <select id="set-deepseek-model">
            <option value="deepseek-flash">deepseek-flash（推荐 · 快）</option>
            <option value="deepseek-v4-pro">deepseek-v4-pro（更强）</option>
          </select>
        </label>
        <label data-for="ollama" class="ollama-only">Ollama 地址 <input id="set-ollama-url" type="text" /></label>
        <label data-for="ollama" class="ollama-only">Ollama 模型 <input id="set-ollama-model" type="text" /></label>
      </fieldset>

      <fieldset>
        <legend>女友</legend>
        <label>角色名字 <input id="set-persona" type="text" /></label>
        <label>你的称呼 <input id="set-username" type="text" /></label>
      </fieldset>

      <fieldset>
        <legend>语音识别 (Faster-Whisper)</legend>
        <label>模型
          <select id="set-whisper-model">
            <option value="tiny">tiny（最快）</option>
            <option value="base">base</option>
            <option value="small">small</option>
            <option value="medium">medium</option>
            <option value="large-v3">large-v3</option>
          </select>
        </label>
        <label>语言
          <select id="set-whisper-lang">
            <option value="zh">中文</option>
            <option value="en">英文</option>
            <option value="ja">日文</option>
          </select>
        </label>
        <label><input id="set-vad" type="checkbox" /> 启用 VAD 自动断句</label>
      </fieldset>

      <fieldset>
        <legend>语音合成 (TTS)</legend>
        <label>服务
          <select id="set-tts-provider">
            <option value="edge">Edge 在线（免费）</option>
            <option value="azure">Azure 官方（需订阅 Key，更稳定）</option>
            <option value="openai">OpenAI 官方（需 API Key）</option>
            <option value="elevenlabs">ElevenLabs（需 API Key，音质最佳）</option>
          </select>
        </label>
        <div data-for="azure-tts">
          <label>Azure 订阅密钥
            <input id="set-azure-key" type="password" placeholder="语音服务的 Key（Azure 门户获取）" />
          </label>
          <label>Azure 区域
            <select id="set-azure-region">
              <option value="eastasia">东亚（香港）</option>
              <option value="southeastasia">东南亚</option>
              <option value="japaneast">日本东部</option>
              <option value="eastus">美国东部</option>
              <option value="westeurope">西欧</option>
            </select>
          </label>
        </div>
        <div data-for="openai-tts">
          <label>OpenAI API Key
            <input id="set-openai-key" type="password" placeholder="sk-...（platform.openai.com 获取）" />
          </label>
          <label>接口地址（中转/代理可选）
            <input id="set-openai-base-url" type="text" placeholder="默认 https://api.openai.com/v1（国内建议填中转地址）" />
          </label>
          <label>模型
            <select id="set-openai-model">
              <option value="tts-1">tts-1（标准·快）</option>
              <option value="tts-1-hd">tts-1-hd（高清）</option>
              <option value="gpt-4o-mini-tts">gpt-4o-mini-tts（支持情绪指令）</option>
            </select>
          </label>
        </div>
        <div data-for="voice-ea">
          <label>音色（Edge/Azure 通用）
            <select id="set-tts-voice">
              <option value="zh-CN-XiaoxiaoNeural">晓晓 Xiaoxiao</option>
              <option value="zh-CN-XiaoyiNeural">晓伊 Xiaoyi</option>
              <option value="zh-CN-YunjianNeural">云健 Yunjian</option>
              <option value="zh-CN-XiaohanNeural">晓涵 Xiaohan</option>
              <option value="zh-CN-XiaomengNeural">晓梦 Xiaomeng</option>
            </select>
          </label>
        </div>
        <div data-for="elevenlabs-tts">
          <label>ElevenLabs API Key
            <input id="set-el-key" type="password" placeholder="elevenlabs.io 注册后 Personal Info 页获取（免费层月 1 万字符）" />
          </label>
          <label>接口地址（中转/代理可选）
            <input id="set-el-base-url" type="text" placeholder="默认 https://api.elevenlabs.io（可填中转地址）" />
          </label>
          <label>模型
            <select id="set-el-model">
              <option value="eleven_multilingual_v2">multilingual_v2（音质最佳·支持中文）</option>
              <option value="eleven_turbo_v2_5">turbo_v2_5（均衡·低延迟）</option>
              <option value="eleven_flash_v2_5">flash_v2_5（最快·支持中文）</option>
            </select>
          </label>
        </div>
        <div data-for="elevenlabs-voice">
          <label>音色（ElevenLabs 预设）
            <select id="set-el-voice">
              <option value="21m00Tcm4TlvDq8ikWAM">Rachel（女·温柔，推荐中文）</option>
              <option value="EXAVITQu4vr4xnSDxMaL">Bella（女·柔和）</option>
              <option value="FGY2WhTYpPnrIDTdsKH5">Laura（女·年轻）</option>
              <option value="pNInz6obpgDQGcFmaJgB">Adam（男·沉稳）</option>
              <option value="ErXwobaYiN019PkySvjV">Antoni（男·亲切）</option>
              <option value="TxGEqnHWrfWFTfGW9XjX">Josh（男·浑厚）</option>
            </select>
          </label>
        </div>
        <div data-for="openai-voice">
          <label>音色（OpenAI）
            <select id="set-openai-voice">
              <option value="nova">nova（女·活泼明亮）</option>
              <option value="shimmer">shimmer（女·轻快）</option>
              <option value="alloy">alloy（中性·均衡）</option>
              <option value="echo">echo（男·沉稳）</option>
              <option value="fable">fable（中性·叙事）</option>
              <option value="onyx">onyx（男·浑厚）</option>
            </select>
          </label>
        </div>
        <label>语速 <input id="set-tts-rate" type="text" placeholder="+0%" /></label>
        <label>音量 <input id="set-tts-volume" type="range" min="0" max="100" /></label>
      </fieldset>

      <fieldset>
        <legend>人设 · System Prompt</legend>
        <div class="prompt-meta-row">
          <span id="prompt-status" class="prompt-status">当前使用：内置默认</span>
          <span id="prompt-count" class="prompt-count">0 字</span>
        </div>
        <textarea id="set-prompt" rows="14" placeholder="留空 = 使用内置默认人设；支持 {persona_name} / {user_name} 占位符（保存后改角色名，人设会自动跟着变）&#10;⚠ 模板内含 JSON 输出格式约束（emotion/action 等），删除那段会导致她失去动作与情绪"></textarea>
        <label class="row-action">
          <button id="set-prompt-load-default" type="button">载入默认进行编辑</button>
          <button id="set-prompt-reset" type="button">恢复内置默认</button>
          <span class="hint">编辑后点底部「保存」生效，下一句话立即按新人设回复</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>系统</legend>
        <label><input id="set-startup" type="checkbox" /> 开机自动启动</label>
        <label>召唤/隐藏快捷键 <input id="set-hotkey" type="text" placeholder="Ctrl+Alt+G" /></label>
        <label><input id="set-fps" type="checkbox" /> 显示 FPS 角标（调试用）</label>
        <label class="row-action"><button id="set-clear-memory" type="button">清除长期记忆</button><span class="hint">忘掉她记住的关于你的事实（不影响对话历史）</span></label>
      </fieldset>

      <div class="settings-actions">
        <button id="set-save" class="btn-primary">保存</button>
        <button id="set-cancel">取消</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <div id="fps-badge" class="fps-badge hidden" title="渲染帧率">--</div>

  <script>console.log('[page] inline script runs at', Date.now());</script>
  <script type="module" src="/renderer/app.js"></script>
</body>
</html>
